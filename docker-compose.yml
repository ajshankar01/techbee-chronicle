# ── TechBee AI Interview Platform — Docker Compose ────────────────────────────
# Development environment with hot-reload for both API and Web

version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techbee_interview
      POSTGRES_USER: techbee
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techbee_dev_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techbee -d techbee_interview"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session cache + pub/sub for WebSocket scaling) ───────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://techbee:${DB_PASSWORD:-techbee_dev_2026}@db:5432/techbee_interview
      REDIS_URL: redis://redis:6379/0
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-techbee-interview}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-techbee-recordings}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      SIMLI_API_KEY: ${SIMLI_API_KEY}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_AZURE_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_TENANT_ID: ${AZURE_AD_TENANT_ID}
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
